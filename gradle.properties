## Gradle 构建参数（BiliBoard 术曲榜 App）
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=C:\\Users\\wuzih\\Desktop\\DSH\\BiliBoard\\.tmp
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Kotlin 编译放在 Gradle 守护进程内执行，避免额外的 Kotlin 守护进程在本机受限环境下启动失败
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
kotlin.incremental=true

android.useAndroidX=true
